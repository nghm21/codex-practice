<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI勉強会のお知らせ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero" role="banner">
        <div class="hero__overlay"></div>
        <div class="hero__content">
          <p class="hero__eyebrow">AI STUDY GROUP</p>
          <h1 class="hero__title">未来をつくるAIとの向き合い方</h1>
          <p class="hero__subtitle">
            最新の生成AIトレンドを学び、社内での活用アイデアを持ち帰りましょう。
          </p>
        </div>
      </header>
      <main class="details" aria-labelledby="details-heading">
        <h2 id="details-heading" class="details__title">開催情報</h2>
        <div class="detail-grid">
          <article class="detail-card">
            <h3 class="detail-card__label">タイトル</h3>
            <p class="detail-card__body">社内AI勉強会 〜共創する未来へ〜</p>
          </article>
          <article class="detail-card">
            <h3 class="detail-card__label">開催日時</h3>
            <p class="detail-card__body">2024年12月12日（木） 18:30-20:30</p>
          </article>
          <article class="detail-card">
            <h3 class="detail-card__label">場所</h3>
            <p class="detail-card__body">本社イノベーションラボ 3F セミナールーム</p>
          </article>
        </div>
      </main>
      <footer class="footer">
        <p>参加登録は社内ポータルからお申し込みください。</p>
      </footer>
    </div>
  </body>
</html>
